<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
    width="1024"
    height="500"
    viewBox="0 0 1024 500"
    role="img"
    aria-labelledby="title description">
  <title id="title">Gráfico de funciones de Nolvida</title>
  <desc id="description">
    Un micrófono conectado visualmente con una tarjeta de recordatorio de Nolvida.
  </desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9F7FF" />
      <stop offset="1" stop-color="#EEE9FF" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="16"
          flood-color="#30265F" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Fondo opaco: Google Play no admite alfa en el gráfico de funciones. -->
  <rect width="1024" height="500" fill="url(#background)" />
  <circle cx="88" cy="72" r="118" fill="#E5DDFF" opacity="0.55" />
  <circle cx="962" cy="446" r="152" fill="#DDD3FF" opacity="0.46" />

  <!-- Captura por voz. -->
  <circle cx="246" cy="250" r="105" fill="#FFFFFF" filter="url(#shadow)" />
  <circle cx="246" cy="250" r="72" fill="#E9E2FF" />
  <rect x="229" y="199" width="34" height="73" rx="17" fill="#171719" />
  <path d="M 208,250 V 255 A 38,38 0 0 0 284,255 V 250"
      fill="none" stroke="#171719" stroke-width="13" stroke-linecap="round" />
  <path d="M 246,293 V 317 M 220,317 H 272"
      fill="none" stroke="#171719" stroke-width="13" stroke-linecap="round" />

  <!-- Transición sencilla entre hablar y conservar el recordatorio. -->
  <circle cx="375" cy="250" r="7" fill="#8D78DC" />
  <circle cx="405" cy="250" r="7" fill="#8D78DC" opacity="0.72" />
  <circle cx="435" cy="250" r="7" fill="#8D78DC" opacity="0.44" />

  <!-- Tarjeta inspirada en la notificación nativa, sin texto dependiente del idioma. -->
  <rect x="472" y="146" width="426" height="208" rx="38"
      fill="#FFFFFF" filter="url(#shadow)" />
  <circle cx="536" cy="205" r="27" fill="#E9E2FF" />
  <g transform="translate(516 183) scale(0.043)" fill="#171719">
    <path fill-rule="evenodd" clip-rule="evenodd"
        d="M 286,329 H 688 V 438 L 744,585 L 671,607 V 723 H 542 V 805 H 286 Z
           M 542,438 V 502 H 603 V 438 Z" />
    <rect x="357" y="160" width="46" height="105"
        transform="rotate(-23 380 212.5)" />
    <rect x="473" y="159" width="47" height="77" />
    <rect x="594" y="160" width="46" height="105"
        transform="rotate(23 617 212.5)" />
  </g>
  <text x="580" y="215" fill="#171719" font-family="Arial, sans-serif"
      font-size="30" font-weight="700">Nolvida</text>
  <rect x="520" y="258" width="245" height="18" rx="9" fill="#29252F" />
  <rect x="520" y="293" width="177" height="12" rx="6" fill="#9A94A6" />
  <circle cx="832" cy="282" r="35" fill="#7651E8" />
  <path d="M 815,282 L 827,294 L 850,269"
      fill="none" stroke="#FFFFFF" stroke-width="9"
      stroke-linecap="round" stroke-linejoin="round" />
</svg>
