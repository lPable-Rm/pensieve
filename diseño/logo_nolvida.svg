<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1024"
    height="1024"
    viewBox="0 0 1024 1024"
    role="img"
    aria-labelledby="title description">
  <title id="title">Símbolo de Nolvida</title>
  <desc id="description">
    Perfil geométrico de una cabeza con tres señales sobre ella.
  </desc>

  <!--
    La silueta usa formas planas para conservar su claridad al reducirla.
    El hueco cuadrado del ojo forma parte del mismo trazado.
  -->
  <path
      fill="#171719"
      fill-rule="evenodd"
      clip-rule="evenodd"
      d="
        M 286,329
        H 688
        V 438
        L 744,585
        L 671,607
        V 723
        H 542
        V 805
        H 286
        Z

        M 542,438
        V 502
        H 603
        V 438
        Z" />

  <!--
    Todas las formas comparten un único color. La aplicación aplicará el
    color de la paleta activa al mostrar el símbolo.
  -->
  <rect
      x="357"
      y="160"
      width="46"
      height="105"
      transform="rotate(-23 380 212.5)"
      fill="#171719" />
  <rect
      x="473"
      y="159"
      width="47"
      height="77"
      fill="#171719" />
  <rect
      x="594"
      y="160"
      width="46"
      height="105"
      transform="rotate(23 617 212.5)"
      fill="#171719" />
</svg>
