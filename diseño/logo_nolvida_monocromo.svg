    width="1024"
    height="1024"
    viewBox="0 0 1024 1024"
    role="img"
    aria-labelledby="title description">
  <title id="title">Símbolo monocromo de Nolvida</title>
  <desc id="description">
    Perfil geométrico monocromo de una cabeza con tres señales sobre ella.
  </desc>

  <!--
    Esta variante de un solo color se puede tintar para la app, el widget
    y otras superficies que no admitan el símbolo de marca a dos colores.
  -->
