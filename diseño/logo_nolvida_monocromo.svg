        clip-rule="evenodd"
        d="
          M 286,329
          H 688
          V 438
          L 744,585
          L 671,607
          V 723
          H 542
          V 805
          H 286
          Z

          M 542,438
          V 502
          H 603
          V 438
          Z" />
    <rect
        x="357"
        y="160"
        width="46"
        height="105"
        transform="rotate(-23 380 212.5)" />
    <rect
        x="473"
        y="159"
        width="47"
        height="77" />
    <rect
        x="594"
        y="160"
        width="46"
        height="105"
        transform="rotate(23 617 212.5)" />
  </g>
</svg>
